name: VUnit CI

on:
  push:
  pull_request:

jobs:
  vunit-ghdl:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v3

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 🔧 Install dependencies
      run: |
        sudo add-apt-repository ppa:mati75/ghdl
        sudo apt update
        sudo apt install ghdl
        pip install vunit_hdl

    - name: ▶️ Run VUnit tests
      run: |
        python run.py
