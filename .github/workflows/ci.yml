name: Run VUnit Tests

on:
  push:
    branches:
      - main
      - test-ci
  pull_request:
  workflow_dispatch:

jobs:
  vunit-ghdl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip
          pip install vunit_hdl

      - name: Install GHDL (LLVM backend)
        uses: ghdl/setup-ghdl@v1
        with:
          backend: llvm

      - name: Run VUnit tests
        run: |
              python run.py tb.tb_timer.default.reset_is_respected
              python run.py tb.tb_timer.default.start_is_ignored_while_busy
              python run.py tb.tb_timer.*.waits_the_correct_amount_of_time

